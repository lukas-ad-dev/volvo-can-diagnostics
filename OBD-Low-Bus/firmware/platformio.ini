[platformio]
test_dir = ../tests

; Volvo CAN Control - PlatformIO
; Ziel: Waveshare Industrial ESP32-S3-RS485-CAN (ESP32-S3R8, 16 MB Flash, 8 MB OPI-PSRAM)
; Getestet mit PlatformIO 6.2.0, espressif32 8.0.0, Arduino Core 3.3.12.

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson@7.4.3
monitor_speed = 115200
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -DUNITY_INCLUDE_DOUBLE
  -Ilib/volvo_core/include
lib_deps =
  throwtheswitch/Unity@2.6.1
